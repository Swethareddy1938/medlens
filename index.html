<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLens — AI Clinical Information Intelligence</title>
  <meta name="description" content="Turn scattered medical information into a clear, reviewable, and traceable patient record with strict non-diagnostic guardrails.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            clinical: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f172a',
              navy: '#0b1329'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Custom Clinical Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
  <!-- Application Mount Target -->
  <div id="root"></div>

  <!-- MedLens Data & Services (Strict Dependency Order) -->
  <script src="js/data/types.js"></script>
  <script src="js/data/demoData.js"></script>
  <script src="js/services/clinicalNLP.js"></script>
  <script src="js/services/conflictDetector.js"></script>
  <script src="js/services/auditService.js"></script>
  <script src="js/services/summaryService.js"></script>

  <!-- Reusable Clinical UI Components -->
  <script src="js/components/SafetyDisclaimer.js"></script>
  <script src="js/components/Navbar.js"></script>
  <script src="js/components/Dashboard.js"></script>
  <script src="js/components/PatientProfile.js"></script>
  <script src="js/components/ReportUpload.js"></script>
  <script src="js/components/StructuredRecord.js"></script>
  <script src="js/components/SourceInspector.js"></script>
  <script src="js/components/VerificationCenter.js"></script>
  <script src="js/components/AISummary.js"></script>
  <script src="js/components/ReportComparison.js"></script>
  <script src="js/components/Timeline.js"></script>
  <script src="js/components/SearchFilter.js"></script>
  <script src="js/components/PrivacySettings.js"></script>
  <script src="js/components/GuidedTour.js"></script>

  <!-- Application Controller -->
  <script src="js/app.js"></script>
</body>
</html>
