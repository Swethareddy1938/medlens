/* Subtle glow animations */

@media print {

    color: black !important;

  .no-print {

      { name: 'Mean Corpuscular Hemoglobin (MCH)', regex: /(?:Mean Corpusc\. Hemoglobin|MCH)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Platelet Count', regex: /(?:Platelet Count|Platelets)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Serum Ferritin', regex: /(?:Serum Ferritin|Ferritin)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Fasting Blood Glucose', regex: /(?:Fasting Blood Glucose|Glucose)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Serum Creatinine', regex: /(?:Serum Creatinine|Creatinine)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'eGFR', regex: /(?:eGFR|Glomerular Filtration)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*(>[0-9\.\s]+|[0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Blood Urea Nitrogen (BUN)', regex: /(?:Blood Urea Nitrogen|BUN)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Serum Sodium', regex: /(?:Serum Sodium|Sodium)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Serum Potassium', regex: /(?:Serum Potassium|Potassium)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'C-Reactive Protein (CRP)', regex: /(?:C-Reactive Protein|CRP)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Erythrocyte Sedimentation Rate (ESR)', regex: /(?:Erythrocyte Sedimentation Rate|ESR)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*(\[[^\]]+\]|[0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Total Cholesterol', regex: /(?:Total Cholesterol|Cholesterol)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'Triglycerides', regex: /(?:Triglycerides|Triglyceride)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'HDL Cholesterol', regex: /(?:HDL Cholesterol|HDL)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i },
      { name: 'LDL Calculated', regex: /(?:LDL Calculated|LDL)[^\d]*(\d+\.?\d*)\s*([a-zA-Z\/%^]+)?\s*([0-9\.\s\-â€“to<>]+)?/i }
    ];

    lines.forEach((line, index) => {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith('=') || trimmed.startsWith('-')) return;

      // Check if line contains a lab pattern
      for (let item of labPatterns) {
        if (line.toLowerCase().includes(item.name.toLowerCase().split(' ')[0])) {
          // Avoid duplicate extraction of same test
          if (results.some(r => r.testName === item.name)) continue;

          // Attempt structured line token split: Test Name | Result | Unit | Reference Range
          // E.g. "Hemoglobin   10.8   g/dL   12.0 - 15.5"
          const tokens = trimmed.split(/\s{2,}|\t/);
          if (tokens.length >= 2) {
            const rawVal = tokens[1].replace(/[^0-9.]/g, '');
            const numVal = parseFloat(rawVal);
            if (!isNaN(numVal)) {
              let unit = tokens.length >= 3 ? tokens[2].trim() : 'unit';
              let rawRange = tokens.length >= 4 ? tokens[3].trim() : '';

              // Check if range is missing or explicitly states not specified
              if (!rawRange || 
                  rawRange.toLowerCase().includes('not provided') || 
                  rawRange.toLowerCase().includes('unspecified') ||
                  rawRange.includes('[')) {
                rawRange = 'Not provided in source';
              }

              const statusEval = window.MedLensNLP.evaluateStatusAgainstSourceRange(numVal, rawRange);
              const confidenceScore = rawRange === 'Not provided in source' ? 88 : 96;
              const confidence = confidenceScore >= 85 ? 'High' : (confidenceScore >= 60 ? 'Medium' : 'Low');

              results.push({
                id: 'ext-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                reportId: metadata.reportId || 'REP-NEW',
                testName: item.name,
                value: numVal.toString(),
                numericValue: numVal,
                unit: unit,
                referenceRange: rawRange,
                status: statusEval.status,
                statusSymbol: statusEval.symbol,
                observation: statusEval.status === 'CANNOT_DETERMINE' 
                  ? 'Source report omits reference range; status cannot be determined per Responsible AI rules.'
                  : `Result is ${statusEval.label} per source reference range (${rawRange}).`,
                reportDate: detectedDate,
                sourceDocument: metadata.fileName || 'Uploaded_Document.pdf',
                sourceLocation: `Line ${index + 1}: "${trimmed}"`,
                sourceSnippet: trimmed,
                confidence: confidence,
                confidenceScore: confidenceScore,
                verificationStatus: (confidence === 'High' && statusEval.status !== 'CANNOT_DETERMINE') ? 'VERIFIED' : 'NEEDS VERIFICATION',
                verifiedBy: null,
                verifiedAt: null
              });
              break;
            }
          }
        }
      }

      // Check for medication mentions in line
      const medMatch = line.match(/(?:Ferrous Sulfate|Cetirizine|Metformin|Metformln|Atorvastatin|Lisinopril|Amoxicillin|Omeprazole)\s*(\d+\s*(?:mg|mcg|g))?/i);
      if (medMatch) {
        const medName = medMatch[0];
        const isAmbiguous = medName.toLowerCase().includes('metformln');
        extractedMedications.push({
          id: 'ext-med-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
          name: medName,
          strength: medMatch[1] || 'Not explicitly stated',
          frequency: line.toLowerCase().includes('bid') ? 'Twice daily' : (line.toLowerCase().includes('daily') ? 'Once daily' : 'As indicated in note'),
          source: `${metadata.fileName || 'Uploaded Document'} (Line ${index + 1})`,
          confidence: isAmbiguous ? 'Low' : 'High',
          confidenceScore: isAmbiguous ? 72 : 95,
          verificationStatus: isAmbiguous ? 'NEEDS VERIFICATION' : 'VERIFIED',
          sourceBadge: 'AI EXTRACTED',
          note: isAmbiguous ? 'Ambiguous OCR text extracted. Requires verification.' : 'Extracted from medication reconciliation section.'
        });
      }
    });

    return {
      results: results,
      extractedMedications: extractedMedications,
      detectedPatientName: detectedPatientName,
      detectedAge: detectedAge,
      detectedDate: detectedDate,
      totalItemsFound: results.length + extractedMedications.length
    };
  }
};

    // MedLens â€” Inconsistency & Conflict Detection Engine
// Flags contradictions between patient profile and uploaded reports

window.MedLensConflictDetector = {
  detectConflicts: function(patient, reports) {
    const conflicts = [];

    reports.forEach(report => {
      // 1. Demographic Check: Age discrepancy
      if (report.rawDocumentText) {
        const ageMatch = report.rawDocumentText.match(/(?:Age|AGE)\s*:\s*(\d{1,3})/i);
        if (ageMatch) {
          const reportAge = parseInt(ageMatch[1], 10);
          if (reportAge && patient.age && reportAge !== patient.age) {
            conflicts.push({
              id: `conf-age-${report.id}`,
              patientId: patient.id,
              reportId: report.id,
              type: 'Demographic Conflict',
              severity: 'Medium',
              title: 'Patient Age Mismatch Across Records',
              description: `Patient profile records age as ${patient.age} (DOB: ${patient.dob}), whereas uploaded report ${report.fileName} records age as ${reportAge}.`,
              sourceA: {
                label: 'Patient Intake Profile',
                value: `Age: ${patient.age} years (DOB: ${patient.dob})`,
                date: patient.lastUpdated ? patient.lastUpdated.split(' ')[0] : 'Current'
              },
              sourceB: {
                label: report.fileName,
                value: `Recorded Age: ${reportAge} years`,
                date: report.reportDate
              },
              status: 'AWAITING_REVIEW',
              resolution: null
            });
          }
        }

        // 2. Medication Discrepancy Check
        // If report mentions a medication not found in patient's active medication list
        const commonMedications = ['Metformin', 'Metformln', 'Lisinopril', 'Levothyroxine', 'Amlodipine', 'Omeprazole'];
        commonMedications.forEach(med => {
          if (report.rawDocumentText.toLowerCase().includes(med.toLowerCase())) {
            const hasInProfile = patient.medications && patient.medications.some(m => 
              m.name.toLowerCase().includes(med.toLowerCase()) || 
              (med === 'Metformln' && m.name.toLowerCase().includes('metformin'))
            );
            
            // Check if flagged as unconfirmed in profile
            const isUnconfirmed = patient.medications && patient.medications.some(m => 
              m.name.toLowerCase().includes(med.toLowerCase()) && m.verificationStatus === 'NEEDS VERIFICATION'
            );

            if (!hasInProfile || isUnconfirmed) {
              const existingConf = conflicts.some(c => c.id === `conf-med-${med}-${report.id}`);
              if (!existingConf) {
                conflicts.push({
                  id: `conf-med-${med}-${report.id}`,
                  patientId: patient.id,
                  reportId: report.id,
                  type: 'Medication Reconciliation Conflict',
                  severity: 'High',
                  title: `Unconfirmed Medication Detected: ${med}`,
                  description: `Report ${report.fileName} mentions "${med}", which is either missing from the confirmed patient medication profile or flagged with low extraction confidence.`,
                  sourceA: {
                    label: 'Confirmed Patient Medications',
                    value: patient.medications && patient.medications.length > 0 
                      ? patient.medications.filter(m => m.verificationStatus === 'VERIFIED').map(m => m.name).join(', ')
                      : 'None recorded',
                    date: 'Current'
                  },
                  sourceB: {
                    label: report.fileName,
                    value: `Mentions "${med}" in document text`,
                    date: report.reportDate
                  },
                  status: 'AWAITING_REVIEW',
                  resolution: null
                });
              }
            }
          }
        });
      }
    });

    return conflicts;
  }
};

    // MedLens â€” Non-Diagnostic AI Summary Generator
// STRICT COMPLIANCE:
// 1. Never diagnose a disease (e.g. NEVER say "Patient has anemia")
// 2. State recorded values neutrally against source reference intervals
// 3. Highlight information gaps and items needing verification
// 4. Emphasize review with qualified healthcare professional

window.MedLensSummaryService = {
  generateSummary: function(patient, reports, conflicts) {
    // Collect all lab results
    const allLabResults = [];
    reports.forEach(rep => {
      if (rep.labResults) {
        rep.labResults.forEach(res => allLabResults.push(res));
      }
    });

    // Partition results based on status
    const lowResults = allLabResults.filter(r => r.status === 'LOW');
    const highResults = allLabResults.filter(r => r.status === 'HIGH');
    const cannotDetermineResults = allLabResults.filter(r => r.status === 'CANNOT_DETERMINE');
    const pendingVerification = allLabResults.filter(r => r.verificationStatus === 'NEEDS VERIFICATION');

    // Dates of reports
    const reportDates = reports.map(r => r.reportDate).filter(Boolean);
    const uniqueDates = [...new Set(reportDates)].sort();

    return {
      disclaimer: "AI-generated summary for information organization only. This is not a medical diagnosis or treatment recommendation. Always verify critical clinical findings with a qualified healthcare professional.",
      
      snapshot: {
        patientName: patient.name,
        patientId: patient.id,
        demographics: `${patient.age} years, ${patient.sex}, DOB: ${patient.dob}`,
        activeConditions: patient.conditions ? patient.conditions.map(c => c.condition) : [],
        activeMedications: patient.medications ? patient.medications.map(m => `${m.name} ${m.strength || ''}`.trim()) : [],
        reportedAllergies: patient.allergies ? patient.allergies.map(a => `${a.allergy} (${a.reaction || 'No reaction stated'})`) : []
      },

      reportOverview: {
        totalReports: reports.length,
        datesCovered: uniqueDates.length > 0 ? `${uniqueDates[0]} to ${uniqueDates[uniqueDates.length - 1]}` : 'None recorded',
        reportTitles: reports.map(r => ({ title: r.reportTitle || r.fileName, date: r.reportDate, source: r.source }))
      },

      keyRecordedFindings: [
        ...lowResults.map(r => ({
          test: r.testName,
          value: `${r.value} ${r.unit}`,
          refRange: r.referenceRange,
          status: 'LOW',
          neutralDescription: `The source report records a value of ${r.value} ${r.unit}, which falls below the laboratory reference interval (${r.referenceRange}) provided on the report.`,
          source: r.sourceDocument,
          date: r.reportDate
        })),
        ...highResults.map(r => ({
          test: r.testName,
          value: `${r.value} ${r.unit}`,
          refRange: r.referenceRange,
          status: 'HIGH',
          neutralDescription: `The source report records a value of ${r.value} ${r.unit}, which exceeds the laboratory reference interval (${r.referenceRange}) provided on the report.`,
          source: r.sourceDocument,
          date: r.reportDate
        }))
      ],

      informationGaps: [
        ...cannotDetermineResults.map(r => ({
          test: r.testName,
          value: `${r.value} ${r.unit}`,
          reason: "The source document does not provide a biological reference range for this test. Under MedLens Responsible AI Rule #6, reference intervals are never inferred, and status remains 'Cannot determine'.",
          source: r.sourceDocument
        })),
        ...(conflicts && conflicts.length > 0 ? conflicts.map(c => ({
          test: c.type,
          value: c.title,
          reason: c.description,
          source: c.sourceB ? c.sourceB.label : 'Document Reconciliation'
        })) : [])
      ],

      itemsRequiringVerification: [
        ...pendingVerification.map(r => ({
          id: r.id,
          title: `Lab Result: ${r.testName} (${r.value} ${r.unit})`,
          detail: `Confidence: ${r.confidence} (${r.confidenceScore || 75}%). Requires clinical reviewer sign-off.`,
          source: r.sourceDocument
        })),
        ...(patient.medications ? patient.medications.filter(m => m.verificationStatus === 'NEEDS VERIFICATION').map(m => ({
          id: m.id,
          title: `Medication: ${m.name}`,
          detail: m.note || 'Extracted with potential OCR ambiguity. Requires human review.',
          source: m.source
        })) : [])
      ],

      clinicalNote: "No diagnostic conclusions have been drawn. Variations in laboratory indices reflect the exact numbers and ranges provided by testing facilities and should be reviewed in clinical context with an attending provider."
    };
  }
};

window.PatientProfile = function({ 
  patient, 
  onUpdatePatient, 
  onAddPatient, 
  isCreatingNew, 
  setIsCreatingNew,
  auditLogger
}) {
  const React = window.React;

  // Form state initialized with patient or blank
  const [formData, setFormData] = React.useState({
    name: patient ? patient.name : '',
    age: patient ? patient.age : '',
    sex: patient ? patient.sex : 'Female',
    dob: patient ? patient.dob : '',
    contact: patient ? patient.contact : '',
    notes: patient ? patient.notes : '',
    symptoms: patient ? [...patient.symptoms] : [],
    conditions: patient ? [...patient.conditions] : [],
    allergies: patient ? [...patient.allergies] : [],
    medications: patient ? [...patient.medications] : []
  });

  const [isEditing, setIsEditing] = React.useState(isCreatingNew);
  const [newSymptomText, setNewSymptomText] = React.useState('');
  const [newConditionText, setNewConditionText] = React.useState('');
  const [newAllergyText, setNewAllergyText] = React.useState('');
  const [newAllergyReaction, setNewAllergyReaction] = React.useState('');
  const [newMedName, setNewMedName] = React.useState('');
  const [newMedStrength, setNewMedStrength] = React.useState('');
  const [newMedFrequency, setNewMedFrequency] = React.useState('');

  // Sync state if patient changes
  React.useEffect(() => {
    if (patient && !isCreatingNew) {
      setFormData({
        name: patient.name,
        age: patient.age,
        sex: patient.sex,
        dob: patient.dob,
        contact: patient.contact || '',
        notes: patient.notes || '',
        symptoms: [...patient.symptoms],
        conditions: [...patient.conditions],
        allergies: [...patient.allergies],
        medications: [...patient.medications]
      });
      setIsEditing(false);
    } else if (isCreatingNew) {
      setFormData({
        name: '',
        age: '',
        sex: 'Female',
        dob: '',
        contact: '',
        notes: '',
        symptoms: [],
        conditions: [],
        allergies: [],
        medications: []
      });
      setIsEditing(true);
    }
  }, [patient, isCreatingNew]);

  const handleSave = (e) => {
    e.preventDefault();
    if (!formData.name) {
      alert('Please provide a patient name.');
      return;
    }

    const now = new Date().toISOString().replace('T', ' ').substr(0, 19);

    if (isCreatingNew) {
      const newId = 'PT-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);
      const newPatientObj = {
        id: newId,
        name: formData.name,
        age: parseInt(formData.age, 10) || 0,
        sex: formData.sex,
        dob: formData.dob,
        contact: formData.contact,
        lastUpdated: now,
        updatedBy: 'Clinical Intake User',
        sourceProvenance: 'USER PROVIDED',
        symptoms: formData.symptoms,
        conditions: formData.conditions,
        allergies: formData.allergies,
        medications: formData.medications,
        notes: formData.notes
      };

      onAddPatient(newPatientObj);
      setIsCreatingNew(false);
      setIsEditing(false);

      if (auditLogger) {
        auditLogger({
          patientId: newId,
          action: 'PATIENT_CREATED',
          entity: 'Patient',
          entityId: newId,
          details: `Created new patient intake profile for ${formData.name}`,
          newValue: formData.name
        });
      }
    } else {
      const updated = {
        ...patient,
        name: formData.name,
        age: parseInt(formData.age, 10) || patient.age,
        sex: formData.sex,
        dob: formData.dob,
        contact: formData.contact,
        notes: formData.notes,
        symptoms: formData.symptoms,
        conditions: formData.conditions,
        allergies: formData.allergies,
        medications: formData.medications,
        lastUpdated: now,
        updatedBy: 'Dr. K. Vance (Verified Update)'

window.ReportUpload = function({ 
  patient, 
  onReportProcessed, 
  samplePresets, 
  setActiveView,
  auditLogger
}) {
  const React = window.React;

  const [uploadMode, setUploadMode] = React.useState('file'); // 'file' | 'text' | 'presets'
  const [dragOver, setDragOver] = React.useState(false);
  const [selectedFile, setSelectedFile] = React.useState(null);
  const [pastedText, setPastedText] = React.useState('');
  const [reportTitle, setReportTitle] = React.useState('Diagnostic Blood Panel');
  const [reportFacility, setReportFacility] = React.useState('Metropolitan Clinical Laboratories');
  const [reportDate, setReportDate] = React.useState(new Date().toISOString().split('T')[0]);

  // Multi-step processing state
  const [isProcessing, setIsProcessing] = React.useState(false);
  const [currentStepIndex, setCurrentStepIndex] = React.useState(0);
  const [extractionResult, setExtractionResult] = React.useState(null);

  const processingSteps = window.MedLensTypes.ProcessingSteps;

  const handleFileSelect = (file) => {
    if (!file) return;
    setSelectedFile(file);
    setReportTitle(file.name.replace(/\.[^/.]+$/, "").replace(/_/g, " "));

    // If text file or readable, read text, else prepare mock OCR text
    if (file.type === 'text/plain') {
      const reader = new FileReader();
      reader.onload = (e) => setPastedText(e.target.result);
      reader.readAsText(file);
    } else {
      // Realistic OCR buffer representation for PDFs/images
      setPastedText(`================================================================================
CLINICAL DIAGNOSTIC ENCOUNTER & LABORATORY REPORT
Facility: Regional Health Medical Laboratory | CLIA ID: 45D920194
Patient: ${patient ? patient.name : 'Unknown'} | DOB: ${patient ? patient.dob : '1998-04-14'}
Date: ${reportDate} | Specimen: Whole Blood / Serum
================================================================================
Test Description              Result    Unit     Reference Range     Flag
White Blood Cell Count (WBC)  6.4       K/uL     4.5 - 11.0          NORMAL
Red Blood Cell Count (RBC)    3.85      M/uL     4.00 - 5.20         LOW
Hemoglobin                    10.8      g/dL     12.0 - 15.5         LOW
Hematocrit                    33.2      %        36.0 - 46.0         LOW
Platelet Count                245       K/uL     150 - 450           NORMAL
Serum Ferritin                9.8       ng/mL    15.0 - 150.0        LOW
================================================================================
Comments: Automated hematology analysis verified by technologist.`);
    }
  };

  const handlePresetSelect = (preset) => {
    setPastedText(preset.rawText);
    setReportTitle(preset.name);
    setUploadMode('text');
  };

  const startProcessing = () => {
    const textToProcess = pastedText.trim();
    if (!textToProcess) {
      alert('Please provide document content or select a sample report preset.');
      return;
    }

    setIsProcessing(true);
    setCurrentStepIndex(1);
    setExtractionResult(null);

    // Realistic step progression through all 7 stages
    let step = 1;
    const interval = setInterval(() => {
      step++;
      setCurrentStepIndex(step);

      if (step === 7) {
        clearInterval(interval);
        setTimeout(() => {
          // Perform actual extraction via MedLensNLP
          const parsed = window.MedLensNLP.parseMedicalDocument(textToProcess, {
            reportId: 'REP-' + Date.now(),
            fileName: selectedFile ? selectedFile.name : `${reportTitle.replace(/\s+/g, '_')}.pdf`,
            reportDate: reportDate,
            facility: reportFacility

          const newReport = {
            id: 'REP-' + Date.now(),
            patientId: patient ? patient.id : 'PT-NEW',
            fileName: selectedFile ? selectedFile.name : `${reportTitle.replace(/\s+/g, '_')}.pdf`,
            fileType: selectedFile ? selectedFile.type : 'application/pdf',
            fileSize: selectedFile ? `${Math.round(selectedFile.size / 1024)} KB` : '384 KB',
            reportTitle: reportTitle,
            reportDate: reportDate,
            uploadDate: new Date().toISOString().replace('T', ' ').substr(0, 19),
            source: reportFacility,

  const [selectedResultForSource, setSelectedResultForSource] = React.useState(null);
  const [anonymizeMode, setAnonymizeMode] = React.useState(false);
  const [toastMessage, setToastMessage] = React.useState(null);

  const triggerToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3500);
  };

  // Find active patient object (apply anonymization if enabled)
  const currentPatientRaw = patients.find(p => p.id === currentPatientId) || patients[0];
  const currentPatient = React.useMemo(() => {
    if (!currentPatientRaw) return null;
    if (!anonymizeMode) return currentPatientRaw;
    return {
      ...currentPatientRaw,
      name: `Patient ${currentPatientRaw.id.substr(3)} [Masked]`,
      dob: 'XXXX-XX-XX',
      contact: 'REDACTED (De-Identification Active)'
    };
  }, [currentPatientRaw, anonymizeMode]);

  // Filter reports and conflicts belonging to active patient
  const patientReports = React.useMemo(() => {
    return reports.filter(r => r.patientId === currentPatientRaw?.id);
  }, [reports, currentPatientRaw]);

  const patientConflicts = React.useMemo(() => {
    return conflicts.filter(c => c.patientId === currentPatientRaw?.id);
  }, [conflicts, currentPatientRaw]);

  const patientClarifications = React.useMemo(() => {
    return clarifications.filter(c => c.patientId === currentPatientRaw?.id);
  }, [clarifications, currentPatientRaw]);

  // Calculate pending verification counts
  const pendingCount = React.useMemo(() => {
    let count = 0;
    patientReports.forEach(r => {
      if (r.labResults) {
        count += r.labResults.filter(res => res.verificationStatus === 'NEEDS VERIFICATION').length;
      }
    });
    if (currentPatientRaw && currentPatientRaw.medications) {
      count += currentPatientRaw.medications.filter(m => m.verificationStatus === 'NEEDS VERIFICATION').length;
    }
    return count;
  }, [patientReports, currentPatientRaw]);

  // Audit logging helper
  const logAudit = (params) => {
    const newEvent = window.MedLensAuditService.createEvent(params);
    setAuditEvents(prev => [newEvent, ...prev]);
  };

  // Handlers for Clinical Actions
  const handleVerifyResult = (itemId, itemType = 'labResult') => {
    if (itemType === 'medication') {
      setPatients(prev => prev.map(p => {
        if (p.id !== currentPatientRaw.id) return p;
        return {
          ...p,
          medications: p.medications.map(m => m.id === itemId ? { ...m, verificationStatus: 'VERIFIED', sourceBadge: 'VERIFIED' } : m)
        };
      }));
      logAudit({
        patientId: currentPatientRaw.id,
        action: 'MEDICATION_VERIFIED',
        entity: 'Medication',
        entityId: itemId,
        details: 'Confirmed medication entry as clinically verified by reviewer'
      });
      triggerToast('âœ“ Medication verified and audit record logged.');
    } else {
      setReports(prev => prev.map(r => {
        if (!r.labResults) return r;
        return {
          ...r,
          labResults: r.labResults.map(res => res.id === itemId ? { ...res, verificationStatus: 'VERIFIED' } : res)
        };
      }));
      logAudit({
        patientId: currentPatientRaw.id,
        action: 'LAB_RESULT_VERIFIED',
        entity: 'LabResult',
        entityId: itemId,
        details: 'Laboratory result marked verified by attending reviewer'
      });
      triggerToast('âœ“ Laboratory result verified and logged.');
    }
  };

  const handleEditResult = (itemId, newValue, rationale) => {
    // Check if it's a lab result or conflict or medication
    let found = false;

    // Check reports labResults
    setReports(prev => prev.map(r => {
      if (!r.labResults) return r;
      return {
        ...r,
        labResults: r.labResults.map(res => {
          if (res.id === itemId) {
            found = true;
            logAudit({
              patientId: currentPatientRaw.id,
              action: 'MANUAL_CLINICAL_CORRECTION',
              entity: 'LabResult',
              entityId: res.id,
              oldValue: res.value,
              newValue: newValue,
              details: `${res.testName} value corrected: "${rationale}"`
            });
            return {
              ...res,
              value: newValue,
              verificationStatus: 'VERIFIED',
              observation: `Manually corrected: ${rationale}`
            };
          }
          return res;
        })
      };
    }));

    // Check medications
    if (!found && currentPatientRaw) {
      setPatients(prev => prev.map(p => {
        if (p.id !== currentPatientRaw.id) return p;
        return {
          ...p,
          medications: p.medications.map(m => {
            if (m.id === itemId) {
              logAudit({
                patientId: currentPatientRaw.id,
                action: 'MEDICATION_CORRECTED',
                entity: 'Medication',
                entityId: m.id,
                oldValue: m.name,
                newValue: newValue,
                details: `Medication corrected: "${rationale}"`
              });
              return {
                ...m,
                name: newValue,
                verificationStatus: 'VERIFIED',
                sourceBadge: 'VERIFIED',
                note: `Corrected by clinician: ${rationale}`
              };
            }
            return m;
          })
        };
      }));
    }

    triggerToast('âœ“ Clinical correction recorded with audit trail.');
  };

  const handleRejectExtraction = (type, id) => {
    if (type === 'medication') {
      setPatients(prev => prev.map(p => {
        if (p.id !== currentPatientRaw.id) return p;
        return {
          ...p,
          medications: p.medications.filter(m => m.id !== id)
        };
      }));
      logAudit({
        patientId: currentPatientRaw.id,
        action: 'EXTRACTION_REJECTED',
        entity: 'Medication',
        entityId: id,
        details: 'Rejected low-confidence OCR extraction as invalid noise'
      });
      triggerToast('Extraction rejected and removed from patient record.');
    } else {
      setReports(prev => prev.map(r => {
        if (!r.labResults) return r;
        return {
          ...r,
          labResults: r.labResults.filter(res => res.id !== id)
        };
      }));
      logAudit({
        patientId: currentPatientRaw.id,
        action: 'EXTRACTION_REJECTED',
        entity: 'LabResult',
        entityId: id,
        details: 'Rejected laboratory extraction item'
      });
      triggerToast('Extracted lab parameter rejected.');
    }
  };

  const handleResolveConflict = (conflictId, resolutionChoice, valueUsed) => {
    setConflicts(prev => prev.map(c => {
      if (c.id === conflictId) {
        logAudit({
          patientId: currentPatientRaw.id,
          action: 'CONFLICT_RESOLVED',
          entity: 'InformationConflict',
          entityId: conflictId,
          details: `Resolved ${c.type}: Selected "${resolutionChoice}" -> "${valueUsed}"`
        });
        return {
          ...c,
          status: 'RESOLVED',
          resolution: `${resolutionChoice} (${valueUsed})`
        };
      }
      return c;
    }));
    triggerToast('âœ“ Inconsistency resolved and logged to audit trail.');
  };

  const handleResolveClarification = (clarId, chosenValue) => {
    setClarifications(prev => prev.map(c => {
      if (c.id === clarId) {
        logAudit({
          patientId: currentPatientRaw.id,
          action: 'CLARIFICATION_ANSWERED',
          entity: 'ClarificationPrompt',
          entityId: clarId,
          newValue: chosenValue,
          details: `Clarification resolved with selection: "${chosenValue}"`
        });
        return {
          ...c,
          status: 'RESOLVED',
          selectedOption: chosenValue,
          resolvedBy: 'Dr. K. Vance'
        };
      }
      return c;
    }));
    triggerToast('âœ“ Clarification answered and record updated.');
  };

  const handleInspectSource = (result) => {
    setSelectedResultForSource(result);
    setActiveView('source-view');
  };

  const handleReportProcessed = (newReport) => {
    setReports(prev => [newReport, ...prev]);

    // Check for conflicts with newly uploaded report
    if (currentPatientRaw) {
      const newConflicts = window.MedLensConflictDetector.detectConflicts(currentPatientRaw, [newReport]);
      if (newConflicts.length > 0) {
        setConflicts(prev => [...newConflicts, ...prev]);
      }
    }

    triggerToast(`âœ“ Successfully processed ${newReport.fileName}!`);
  };

  const handleAddPatient = (newPat) => {
    setPatients(prev => [newPat, ...prev]);
    setCurrentPatientId(newPat.id);
    setActiveView('profile');
    triggerToast(`âœ“ Created intake profile for ${newPat.name}!`);
  };

  const handleUpdatePatient = (updated) => {
    setPatients(prev => prev.map(p => p.id === updated.id ? updated : p));
    triggerToast('âœ“ Patient profile updated successfully.');
  };

  const handleResetDemoData = () => {
    setPatients(window.MedLensDemoData.patients);
    setCurrentPatientId(window.MedLensDemoData.currentPatientId);
    setReports(window.MedLensDemoData.reports);
    setConflicts(window.MedLensDemoData.conflicts);
    setClarifications(window.MedLensDemoData.clarifications);
    setAuditEvents(window.MedLensDemoData.auditEvents);
    setAnonymizeMode(false);
    triggerToast('â†º Fictional demo dataset restored.');
  };

  return React.createElement('div', { className: 'min-h-screen bg-slate-50 flex flex-col' }, [
    // Top Navigation
    React.createElement(window.Navbar, {
      key: 'navbar',
      activeView: activeView,
      setActiveView: setActiveView,
      currentPatient: currentPatient,
      patients: patients,
      onSelectPatient: setCurrentPatientId,
      pendingVerificationCount: pendingCount,
      onStartTour: () => setIsTourOpen(true),
      onOpenNewPatient: () => {
        setIsCreatingNewPatient(true);
        setActiveView('profile');
      },
      onOpenUpload: () => setActiveView('upload')
    }),

    // Global Toast Notification
    toastMessage && React.createElement('div', {
      key: 'toast',
      className: 'fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 border border-slate-700 animate-bounce text-xs font-semibold'
    }, [
      React.createElement('span', { key: 'icon', className: 'text-emerald-400 font-bold' }, 'âš¡'),
      React.createElement('span', { key: 'txt' }, toastMessage)
    ]),

    // Main Container Area
    React.createElement('main', { key: 'main-content', className: 'flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6' }, [
      // View 1: Dashboard
      activeView === 'dashboard' && React.createElement(window.Dashboard, {
        patient: currentPatient,
        patients: patients,
        reports: patientReports,
        conflicts: patientConflicts,
        pendingVerificationCount: pendingCount,
        setActiveView: setActiveView,
        onOpenUpload: () => setActiveView('upload'),
        onOpenNewPatient: () => {
          setIsCreatingNewPatient(true);
          setActiveView('profile');
        },
        onStartTour: () => setIsTourOpen(true)
      }),

      // View 2: Patient Profile & Intake
      activeView === 'profile' && React.createElement(window.PatientProfile, {
        patient: currentPatient,
        onUpdatePatient: handleUpdatePatient,
        onAddPatient: handleAddPatient,
        isCreatingNew: isCreatingNewPatient,
        setIsCreatingNew: setIsCreatingNewPatient,
        auditLogger: logAudit
      }),

      // View 3: Medical Reports Upload
      (activeView === 'reports' || activeView === 'upload') && React.createElement(window.ReportUpload, {
        patient: currentPatient,
        onReportProcessed: handleReportProcessed,
        samplePresets: window.MedLensDemoData.sampleUploadPresets,
        setActiveView: setActiveView,
        auditLogger: logAudit
      }),

      // View 4: Structured Medical Record
      activeView === 'records' && React.createElement(window.StructuredRecord, {
        patient: currentPatient,
        reports: patientReports,
        onInspectSource: handleInspectSource,
        onVerifyResult: handleVerifyResult,
        setActiveView: setActiveView
      }),

      // View 5: Side-by-Side Source View
      activeView === 'source-view' && React.createElement(window.SourceInspector, {
        reports: patientReports,
        selectedResult: selectedResultForSource,
        onSelectResult: setSelectedResultForSource,
        onVerifyResult: handleVerifyResult
      }),

      // View 6: Non-Diagnostic AI Summary
      activeView === 'summary' && React.createElement(window.AISummary, {
        patient: currentPatient,
        reports: patientReports,
        conflicts: patientConflicts,
        setActiveView: setActiveView
      }),

      // View 7: Report Comparison
      activeView === 'comparison' && React.createElement(window.ReportComparison, {
        reports: patientReports
      }),

      // View 8: Clinical Timeline
      activeView === 'timeline' && React.createElement(window.Timeline, {
        patient: currentPatient,
        reports: patientReports,
        auditEvents: auditEvents,
        setActiveView: setActiveView,
        onInspectSource: handleInspectSource
      }),

      // View 9: Verification Center
      activeView === 'verification' && React.createElement(window.VerificationCenter, {
        patient: currentPatient,
        reports: patientReports,
        conflicts: patientConflicts,
        clarifications: patientClarifications,
        auditEvents: auditEvents,
        onResolveConflict: handleResolveConflict,
        onResolveClarification: handleResolveClarification,
        onVerifyResult: handleVerifyResult,
        onEditResult: handleEditResult,
        onRejectExtraction: handleRejectExtraction
      }),

      // View 10: Search & Filters
      activeView === 'search' && React.createElement(window.SearchFilter, {
        patient: currentPatient,
        reports: patientReports,
        onInspectSource: handleInspectSource,
        setActiveView: setActiveView
      }),

      // View 11: Privacy & Settings
      activeView === 'privacy' && React.createElement(window.PrivacySettings, {
        patient: currentPatient,
        reports: patientReports,
        onResetDemoData: handleResetDemoData,
        anonymizeMode: anonymizeMode,
        setAnonymizeMode: setAnonymizeMode,
        auditLogger: logAudit
      })
    ]),

    // Interactive Guided Tour Stepper Modal
    React.createElement(window.GuidedTour, {
      key: 'tour-modal',
      isOpen: isTourOpen,
      onClose: () => setIsTourOpen(false),
      setActiveView: setActiveView
    }),

    // Global Persistent Footer
    React.createElement('footer', { key: 'footer', className: 'bg-white border-t border-slate-200 mt-auto py-6' }, [
      React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500' }, [
        React.createElement('div', { className: 'flex items-center gap-2' }, [
          React.createElement('span', { className: 'font-extrabold text-slate-800' }, 'MedLens Clinical Intelligence'),
          React.createElement('span', {}, 'â€¢'),
          React.createElement('span', {}, 'Human-in-the-Loop Architecture'),
          React.createElement('span', {}, 'â€¢'),
          React.createElement('span', { className: 'text-emerald-700 font-bold' }, 'Demonstration Sandbox')
        ]),
        React.createElement('div', { className: 'text-[11px] text-slate-400' }, 
          'Strictly Non-Diagnostic: Information Organization & Review Only'
        )
      ])
    ])
  ]);
};

// Mount Application
document.addEventListener('DOMContentLoaded', () => {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(window.MedLensApp));
});

  </script>
</body>
</html>
